services:
  db:
    image: postgres:18
    # POSTGRES_USER, POSTGRES_PASSWORD e POSTGRES_DB vêm do .env do backend
    env_file: ./backend/.env
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    # Monta a imagem a partir do backend/Dockerfile
    build: ./backend
    env_file: ./backend/.env
    environment:
      # Dentro da rede do Compose o banco se chama "db" e usa a porta interna
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "127.0.0.1:8000:8000"
    # Saudável = /health respondeu. A imagem slim não tem curl, então usa Python
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    # Só sobe a API depois que o healthcheck do banco passar
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
