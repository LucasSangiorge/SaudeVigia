name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  qualidade:
    name: Ruff e pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (formatação)
        run: ruff format --check .

      - name: Testes
        run: pytest

  docker:
    name: Docker (build, testes e /health)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Testes dentro do contêiner (etapa dev)
        run: |
          docker build --target dev -t saudevigia-api:dev backend
          docker run --rm saudevigia-api:dev

      - name: Subir API e banco com o Compose (etapa prod)
        run: |
          cp backend/.env.example backend/.env
          docker compose up -d --build --wait

      - name: Chamar o /health
        run: curl --fail --silent --show-error http://127.0.0.1:8000/health

      - name: Logs dos contêineres (só se algo falhou)
        if: failure()
        run: docker compose logs

      - name: Derrubar os contêineres
        if: always()
        run: docker compose down -v
